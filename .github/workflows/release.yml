name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest test_server_rules test_game_rules
      - run: python build_release.py ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RCCServer-${{ github.ref_name }}.zip
            dist/RCCServer-linux-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
